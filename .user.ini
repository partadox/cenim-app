; Batas PHP untuk folder aplikasi CENIM (dibaca php-fpm/FastCGI: Valet & cPanel).
; Harus >= config/app.php -> upload.max_bytes (5 MB), kalau tidak upload yang
; menurut aplikasi masih sah akan ditolak php-fpm sebelum kodenya jalan.
; Perubahan berlaku setelah user_ini.cache_ttl (default 300 detik).
upload_max_filesize = 8M
post_max_size = 16M
max_file_uploads = 10
